[project]
name = "PVShop"
version = "0.1.0"
description = "Shop API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adrf>=0.1.13",
    "celery>=5.6.2",
    "cryptography>=50.0.0",
    "daphne>=4.2.2",
    "django>=6.0.8,<6.1",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-unfold>=0.78.1",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "drf-spectacular>=0.29.0",
    "flower>=2.0.1",
    "gunicorn>=25.0.1",
    "markdown>=3.10.1",
    "model-bakery>=1.24.0",
    "pillow>=12.1.0",
    "psycopg2-binary>=2.9.11",
    "redis>=6.2.0",
    "requests>=2.34.2",
    "sqlparse>=0.6.0",
    "stripe>=15.3.1",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-asyncio>=0.25.0",
]

# Black only formats; all rule selection/linting lives in [tool.ruff] below - Black has no
# "lint"/"select" concept, that section previously errored out with
# "Invalid config keys detected: 'lint'" and "Config key target-version must be a list".
[tool.black]
target-version = ["py313"]
line-length = 88
extend-exclude = "/migrations/"   # generated files, reviewed by hand

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations"]   # generated files, reviewed by hand

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "I", # import sorting
    "N", # pep8-naming
    "UP", # pyupgrade keeps 3.13 idioms
    "B", # bugbear
    "C4", # comprehensions
    "DTZ", # naive datetime, avoid tz-naive datetimes throughout the shop/order flow
    "ASYNC", # blocking calls in adrf async views (see django-drf-adrf.mdc)
    "S", # bandit security rules
    "T20", # stray print()
    "SIM", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# asserts and hardcoded test credentials/fixtures are fine in tests
"apps/*/tests/**" = ["S101", "S105", "S106"]

# mypy only type-checks; pydantic isn't used in this DRF project (no pydantic dependency),
# so the "pydantic.mypy" plugin previously made every run fail with
# "Error importing plugin pydantic.mypy: No module named 'pydantic'".
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# Required, not optional: flat top-level packages with no __init__.py mean mypy would
# otherwise map e.g. apps/orders/tests/x.py and apps/accounts/tests/x.py to the same module
# name and abort with "Duplicate module named x" before checking anything.
explicit_package_bases = true
namespace_packages = true

# pytest/pytest-asyncio options previously lived under [tool.mypy] by mistake (mypy warned
# "Unrecognized option" for every one of them); pytest-django is the project's chosen test
# runner alongside Django's own `manage.py test` (see django-drf-adrf.mdc).
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["apps"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
